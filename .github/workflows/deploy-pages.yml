name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        env:
          VITE_BASE: /vietnamese-learning/
          VITE_API_BASE: ${{ vars.API_BASE }}
        run: npm run build -w @viet/web

      - name: Build admin
        env:
          VITE_BASE: /vietnamese-learning/admin/
          VITE_API_BASE: ${{ vars.API_BASE }}
        run: npm run build -w @viet/admin

      - name: Assemble site
        run: |
          mkdir -p site/admin
          cp -r apps/web/dist/. site/
          cp -r apps/admin/dist/. site/admin/
          # SPA 回退：GitHub Pages 对未知路径返回 404.html
          cp site/index.html site/404.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
